{% extends "base.html" %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 20px; width: 100%;">

    <!-- Camera Feed -->
    <div class="card cameraContainer">
        <img id="cameraFeed" src="{{ url_for('video_feed', cam_name=selected_cam) }}">
    </div>

    <div id="normalUI">
        <div class="card" style="min-width: 260px; flex-shrink: 0;">

            <label for="cameraDropdown" class="bigLabel" style="color:#39FF14;">Select Camera:</label>

            <div id="cameraControl" style="display:flex; align-items:center; gap:8px;">
                <select id="cameraDropdown">
                    {% for name in cameras %}
                        <option value="{{ loop.index0 }}" {% if name == selected_index %}selected{% endif %}>
                            {{ name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="divider"></div>

            <button id="startCalibrationBtn" style="
                background-color:#000;
                color:#39FF14;
                border:2px solid #39FF14;
                padding:10px 20px;
                font-size:16px;
                cursor:pointer;
            ">
                Start Calibration
            </button>
        </div>

        <div class="card" style="display:none; justify-content:center; padding:15px;" id="endCard">
            <div id="calibrationEnd" style="
                color:#39FF14;
                font-size:20px;
                display:block;
            ">
            </div>
        </div>
    </div>

    <div id="calibUI" style="display: none;">
        <div class="card" style="display:flex; justify-content:center; padding:15px;">
            <button id="endCalibrationBtn" style="
                background-color:#000;
                color:#39FF14;
                border:2px solid #39FF14;
                padding:10px 20px;
                font-size:16px;
                cursor:pointer;
            ">
                End Calibration
            </button>
        </div>

        <div class="card" style="display:none; justify-content:center; padding:15px;" id="statusCard">
            <div id="calibrationStatus" style="
                color:#39FF14;
                font-size:20px;
                display:block;
            ">
            </div>
        </div>
    </div>
</div>

<script>
const dropdown = document.getElementById("cameraDropdown");
const img = document.getElementById("cameraFeed");
const startCalibBtn = document.getElementById("startCalibrationBtn");
const endCalibBtn = document.getElementById("endCalibrationBtn");
const normalUI = document.getElementById("normalUI");
const calibUI = document.getElementById("calibUI");
const statusCard = document.getElementById("statusCard");
const calibrationStatus = document.getElementById("calibrationStatus");
const endCard = document.getElementById("endCard");
const calibrationEnd = document.getElementById("calibrationEnd");

let polling = false;

startCalibBtn.addEventListener("click", function() {
    normalUI.style.display = "none";
    calibUI.style.display = "block";

    fetch('/set_camera_setting', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            index: dropdown.value,
            key: "is_calibrating",
            value: true
        })
    });
});

endCalibBtn.addEventListener("click", function() {
    calibrationStatus.textContent = "Please wait...";
    statusCard.style.display = "block";

    polling = true;
    pollCalibrationStatus();

    fetch('/set_camera_setting', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            index: dropdown.value,
            key: "is_calibrating",
            value: false
        })
    });
});

function pollCalibrationStatus() {
    if (!polling) return;

    fetch('/get_calibration_status')
        .then(response => response.json())
        .then(data => {
            if (data.done === null) {
                statusCard.style.display = "block";
                calibrationStatus.textContent = "Saving calibration...";
                setTimeout(pollCalibrationStatus, 500); // Poll every 500ms
            } else {
                polling = false;

                normalUI.style.display = "block";
                calibUI.style.display = "none";

                if (data.done) {
                    calibrationEnd.textContent = "Calibration successful!";
                    endCard.style.display = "block";
                } else {
                    calibrationEnd.textContent = "Calibration failed. Please try again.";
                    endCard.style.display = "block";
                }

                // Hide the status message after 5 seconds
                setTimeout(() => {
                    endCard.style.display = "none";
                }, 5000);
            }
        });
}

dropdown.addEventListener('change', () => {
    const index = dropdown.value;
    const name = dropdown.options[dropdown.selectedIndex].text;
    img.src = `/video_feed?cam_name=${encodeURIComponent(name)}&t=${Date.now()}`;
});

document.addEventListener("DOMContentLoaded", () => {
    const index = dropdown.value;
    const name = dropdown.options[dropdown.selectedIndex].text;
    img.src = `/video_feed?cam_name=${encodeURIComponent(name)}&t=${Date.now()}`;
});

</script>
{% endblock %}

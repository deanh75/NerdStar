{% extends "base.html" %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: flex-start; width: 100%">
    <!-- Network Settings -->
    <div class="settingsGroup">
        <div class="settingRow">
            <span>Team Number</span>
            <input type="number" id="team_number">
        </div>

        <div class="settingRow">
            <span>Device ID</span>
            <input type="text" id="device_id">
        </div>

        <div class="divider"></div>
    </div>

    <!-- Object Detection -->
    <div class="settingsGroup">
        <div class="settingRow">
            <span>Max Object Detection FPS</span>
            <input type="number" id="obj_detect_max_fps">
        </div>

        <div class="settingRow">
            <span>Object Detection Model</span>
            <select id="modelDropdown" class="dropdown">
                <option value="">Loading...</option>
            </select>
        </div>

        <div class="settingRow">
            <span>Upload Object Detection Model</span>
            <button id="objFileBtn" class="button">
                Upload Model
            </button>
            <input type="file" id="objFileInput" style="display:none;">
        </div>

        <div class="divider"></div>
    </div>

    <!-- Video Settings -->
    <div class="settingsGroup">
        <div class="settingRow">
            <span>Video Framerate</span>
            <input type="number" id="video_framerate">
        </div>

        <div class="divider"></div>
    </div>

    <div class="settingsGroup">
        <div class="settingRow">
            <span>Fiducial Size (m)</span>
            <input type="number" id="fiducial_size_m">
        </div>

        <div class="settingRow">
            <span>Apriltag Layout</span>
            <select id="tagLayoutDropdown" class="dropdown">
                <option value="">Loading...</option>
            </select>
        </div>

        <div class="settingRow">
            <span>Upload Apriltag Layout</span>
            <button id="tagLayoutFileBtn" class="button">
                Upload Layout
            </button>
            <input type="file" id="tagLayoutFileInput" style="display:none;">
        </div>

        <div class="divider"></div>
    </div>

    <!-- Recording -->
    <div class="settingsGroup">
        <div class="settingRow">
            <span>Record Video</span>
            <label class="switch">
                <input type="checkbox" id="should_record">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>
<script>
const teamNumber = document.getElementById('team_number');
const deviceId = document.getElementById('device_id');
const objDetectMaxFps = document.getElementById('obj_detect_max_fps');
const modelDropdown = document.getElementById('modelDropdown');
const objFileBtn = document.getElementById("objFileBtn");
const objFileInput = document.getElementById("objFileInput");
const videoFramerate = document.getElementById('video_framerate');
const fiducialSizeM = document.getElementById('fiducial_size_m');
const tagLayoutDropdown = document.getElementById('tagLayoutDropdown');
const tagLayoutFileBtn = document.getElementById('tagLayoutFileBtn');
const tagLayoutFileInput = document.getElementById('tagLayoutFileInput');
const shouldRecord = document.getElementById('should_record');

function loadSettings() {
    fetch(`/get_mac_settings`)
        .then(res => res.json())
        .then(data => {
            teamNumber.value = data.team_number;
            deviceId.value = data.device_id;
            objDetectMaxFps.value = data.obj_detect_max_fps;
            videoFramerate.value = data.video_framerate;
            fiducialSizeM.value = data.fiducial_size_m;
            shouldRecord.checked = data.should_record;
        });
}

function loadModels() {
    fetch(`/get_models`)
        .then(res => res.json())
        .then(data => {
            modelDropdown.innerHTML = '';

            if (data.models.length === 0) {
                const option = document.createElement('option');
                option.textContent = 'No models available';
                option.disabled = true;
                modelDropdown.appendChild(option);
                return;
            }

            data.models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model.split('.')[0];

                if (model === data.selected) {
                    option.selected = true;
                }

                modelDropdown.appendChild(option);
            });

            modelDropdown.dispatchEvent(new Event('change', { bubbles: true }));
        });
}

function loadTagLayouts() {
    fetch(`/get_tag_layouts`)
        .then(res => res.json())
        .then(data => {
            tagLayoutDropdown.innerHTML = '';

            if (data.layouts.length === 0) {
                const option = document.createElement('option');
                option.textContent = 'No layouts available';
                option.disabled = true;
                tagLayoutDropdown.appendChild(option);
                return;
            }

            data.layouts.forEach(layout => {
                const option = document.createElement('option');
                option.value = layout;
                option.textContent = layout.split('.')[0];

                if (layout === data.selected) {
                    option.selected = true;
                }

                tagLayoutDropdown.appendChild(option);
            });

            tagLayoutDropdown.dispatchEvent(new Event('change', { bubbles: true }));
        });
}

teamNumber.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'team_number',
            value: Number(teamNumber.value)
        })
    }).then(fetch('/restart', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    }));
});

deviceId.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'device_id',
            value: deviceId.value
        })
    }).then(fetch('/restart', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    }));
});

objDetectMaxFps.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'obj_detect_max_fps',
            value: Number(objDetectMaxFps.value)
        })
    });
});

modelDropdown.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'obj_detect_model',
            value: modelDropdown.value
        })
    });
});

objFileBtn.addEventListener('click', () => {
    objFileInput.click();
});

objFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const formData = new FormData();
        formData.append('file', file);
        fetch('/upload_model', {
            method: 'POST',
            body: formData
        }).then(() => {
            loadModels();
        });
    }
});

videoFramerate.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'video_framerate',
            value: Number(videoFramerate.value)
        })
    });
});

fiducialSizeM.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'fiducial_size_m',
            value: Number(fiducialSizeM.value)
        })
    });
});

tagLayoutDropdown.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'tag_layout_name',
            value: tagLayoutDropdown.value
        })
    });
});

tagLayoutFileBtn.addEventListener('click', () => {
    tagLayoutFileInput.click();
});

tagLayoutFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const formData = new FormData();
        formData.append('file', file);
        fetch('/upload_tag_layout', {
            method: 'POST',
            body: formData
        }).then(() => {
            loadTagLayouts();
        });
    }
});

shouldRecord.addEventListener('change', () => {
    fetch('/set_mac_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            key: 'should_record',
            value: shouldRecord.checked
        })
    });
});

document.addEventListener("DOMContentLoaded", () => {
    loadSettings();
    loadModels();
    loadTagLayouts();
});
</script>
{% endblock %}
